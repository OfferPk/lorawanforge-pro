<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="650" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="50" y="55" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">LoRaWANForge Pro — Architecture &amp; LPWAN Protocol Stack</text>
  <text x="50" y="80" fill="#94a3b8" font-family="sans-serif" font-size="14">LoRaWAN 1.0.4 / 1.1 Specification, Semtech Packet Forwarder, &amp; Zero-Trust Security</text>

  <!-- Protocol Layer Stack -->
  <rect x="50" y="110" width="480" height="490" rx="8" fill="#0d1224" stroke="#334155"/>
  <text x="75" y="145" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">LoRaWAN Protocol Encapsulation</text>

  <!-- Layer 7 -->
  <rect x="75" y="165" width="430" height="80" rx="6" fill="#7e22ce" stroke="#a855f7"/>
  <text x="90" y="190" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 7: Application Data (FRMPayload)</text>
  <text x="90" y="210" fill="#f3e8ff" font-family="sans-serif" font-size="12">Encrypted via AES-128 CTR mode using AppSKey</text>
  <text x="90" y="228" fill="#f3e8ff" font-family="sans-serif" font-size="12">FPort: 1..223 (Sensors: Cayenne LPP, Modbus, Metering telemetry)</text>

  <!-- Layer 2b -->
  <rect x="75" y="255" width="430" height="80" rx="6" fill="#0369a1" stroke="#0ea5e9"/>
  <text x="90" y="280" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 2b: LoRaWAN MAC Layer (MACPayload &amp; MIC)</text>
  <text x="90" y="300" fill="#bae6fd" font-family="sans-serif" font-size="12">MHDR | DevAddr (4B) | FCtrl (1B) | FCnt (2B) | FOpts (0-15B)</text>
  <text x="90" y="318" fill="#bae6fd" font-family="sans-serif" font-size="12">4-Byte MIC calculated via AES-128 CMAC (RFC 4493) using NwkSKey</text>

  <!-- Layer 2a -->
  <rect x="75" y="345" width="430" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="90" y="370" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 2a: Gateway Protocol (Semtech UDP 1700 / Basic Station)</text>
  <text x="90" y="390" fill="#cbd5e1" font-family="sans-serif" font-size="12">JSON 'rxpk' Telemetry: Time, Freq, SF, BW, RSSI, SNR, Base64</text>

  <!-- Layer 1 -->
  <rect x="75" y="420" width="430" height="70" rx="6" fill="#020409" stroke="#334155"/>
  <text x="90" y="445" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700">Layer 1: LoRa Physical Layer (CSS Chirp Spread Spectrum)</text>
  <text x="90" y="465" fill="#94a3b8" font-family="sans-serif" font-size="12">Spreading Factor (SF7..SF12) | Bandwidth (125/250/500 kHz)</text>
  <text x="90" y="480" fill="#94a3b8" font-family="sans-serif" font-size="11">EU868 (1% Duty Cycle) | US915 (FCC 400ms Dwell) | AS923 | AU915</text>

  <!-- Engine Modules -->
  <rect x="560" y="110" width="490" height="490" rx="8" fill="#0d1224" stroke="#334155"/>
  <text x="585" y="145" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">LoRaWANForge Pro Engine Modules</text>

  <rect x="585" y="165" width="440" height="70" rx="6" fill="#04060d" stroke="#a855f7"/>
  <text x="600" y="190" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="700">LoRaWANProtocolEngine (JS &amp; Python CLI)</text>
  <text x="600" y="210" fill="#94a3b8" font-family="sans-serif" font-size="12">• PHY airtime mathematical modeling (Ts, preamble, payload)</text>
  <text x="600" y="226" fill="#94a3b8" font-family="sans-serif" font-size="12">• AES-128 CMAC MIC &amp; CTR cipher, Semtech UDP JSON, Libpcap</text>

  <rect x="585" y="245" width="440" height="70" rx="6" fill="#04060d" stroke="#a855f7"/>
  <text x="600" y="270" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="700">LoRaWANSecurityAuditor (Zero-Trust IoT)</text>
  <text x="600" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">• 10-point audit matrix (AppKey entropy, DevNonce replay check)</text>
  <text x="600" y="306" fill="#94a3b8" font-family="sans-serif" font-size="12">• OTAA vs ABP, FCnt validation, backhaul TLS, duty cycle caps</text>

  <rect x="585" y="325" width="440" height="70" rx="6" fill="#04060d" stroke="#a855f7"/>
  <text x="600" y="350" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="700">LoRaWANConfigSynthesizer (Defense Generator)</text>
  <text x="600" y="370" fill="#94a3b8" font-family="sans-serif" font-size="12">• Linux nftables gateway conduit rules (Port 1700 / Port 8887)</text>
  <text x="600" y="386" fill="#94a3b8" font-family="sans-serif" font-size="12">• Suricata L7 signatures for Semtech packet forwarder anomalies</text>

  <rect x="585" y="405" width="440" height="75" rx="6" fill="#04060d" stroke="#334155"/>
  <text x="600" y="430" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Universal Delivery Formats</text>
  <text x="600" y="450" fill="#94a3b8" font-family="sans-serif" font-size="12">• Zero-dependency HTML5 Web Studio (offline air-gap ready)</text>
  <text x="600" y="468" fill="#94a3b8" font-family="sans-serif" font-size="12">• Standalone Python 3 CLI (`lorawanforge-cli.py`, executable)</text>

  <!-- Bottom Badge -->
  <rect x="585" y="495" width="440" height="80" rx="6" fill="#080c18" stroke="#10b981"/>
  <text x="600" y="525" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700">✓ Target IoT Endpoints Supported:</text>
  <text x="600" y="545" fill="#f8fafc" font-family="sans-serif" font-size="12">Semtech SX1276/SX1262, STM32WL, ESP32 LoRa, Nordic nRF, RAKwireless</text>
  <text x="600" y="563" fill="#94a3b8" font-family="sans-serif" font-size="11">ChirpStack, The Things Network (TTN), AWS IoT Core for LoRaWAN, Senet, Actility</text>
</svg>