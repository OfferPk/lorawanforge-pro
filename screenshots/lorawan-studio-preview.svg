<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="50" rx="8" fill="#0d1224"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="125" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600">LoRaWANForge Pro v1.0.0 — Industrial &amp; Smart City LoRaWAN (v1.0.4 / v1.1) Protocol Studio</text>
  <rect x="990" y="42" width="160" height="26" rx="4" fill="#a855f7"/>
  <text x="1005" y="59" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">WIRESHARK PCAP (1700)</text>

  <!-- Main Navigation Tabs -->
  <rect x="30" y="90" width="1140" height="45" fill="#060812"/>
  <rect x="40" y="95" width="170" height="35" rx="6" fill="#a855f7"/>
  <text x="55" y="118" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">1. Frame Dissector</text>

  <rect x="220" y="95" width="220" height="35" rx="6" fill="#0d1224"/>
  <text x="235" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">2. Uplink / Downlink Synth</text>

  <rect x="450" y="95" width="210" height="35" rx="6" fill="#0d1224"/>
  <text x="465" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">3. PHY Airtime &amp; Budget</text>

  <rect x="670" y="95" width="220" height="35" rx="6" fill="#0d1224"/>
  <text x="685" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">4. Zero-Trust Auditor</text>

  <rect x="900" y="95" width="200" height="35" rx="6" fill="#0d1224"/>
  <text x="915" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">5. Gateway Firewall</text>

  <!-- Left Column: Controls Card -->
  <rect x="30" y="150" width="550" height="510" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="55" y="185" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">LoRaWAN Frame Configuration &amp; AES-128 Engine</text>

  <!-- Form Fields -->
  <rect x="55" y="210" width="240" height="40" rx="6" fill="#04060d" stroke="#334155"/>
  <text x="65" y="235" fill="#64748b" font-family="sans-serif" font-size="12">MType: <tspan fill="#a855f7" font-weight="600">Unconfirmed Data Up (0x40)</tspan></text>

  <rect x="315" y="210" width="240" height="40" rx="6" fill="#04060d" stroke="#334155"/>
  <text x="325" y="235" fill="#64748b" font-family="sans-serif" font-size="12">DevAddr: <tspan fill="#06b6d4" font-weight="600">01 02 03 04</tspan></text>

  <rect x="55" y="265" width="150" height="40" rx="6" fill="#04060d" stroke="#334155"/>
  <text x="65" y="290" fill="#64748b" font-family="sans-serif" font-size="12">FCnt: <tspan fill="#f8fafc" font-weight="600">1</tspan></text>

  <rect x="220" y="265" width="150" height="40" rx="6" fill="#04060d" stroke="#334155"/>
  <text x="230" y="290" fill="#64748b" font-family="sans-serif" font-size="12">FPort: <tspan fill="#f8fafc" font-weight="600">1</tspan></text>

  <rect x="385" y="265" width="170" height="40" rx="6" fill="#04060d" stroke="#334155"/>
  <text x="395" y="290" fill="#64748b" font-family="sans-serif" font-size="12">Payload: <tspan fill="#10b981" font-weight="600">01670110 (27.2°C)</tspan></text>

  <!-- Formula Callout -->
  <rect x="55" y="325" width="500" height="50" rx="6" fill="#080c18" stroke="#a855f7" stroke-width="1"/>
  <text x="70" y="347" fill="#a855f7" font-family="monospace" font-size="12" font-weight="600">RFC 4493 AES-128 CMAC Message Integrity Code (MIC):</text>
  <text x="70" y="365" fill="#cbd5e1" font-family="monospace" font-size="12">MIC = AES_CMAC(NwkSKey, B0 || MHDR || FHDR || FPort || FRMPayload)[0..3]</text>

  <!-- Hex Stream Box -->
  <rect x="55" y="395" width="500" height="150" rx="6" fill="#020409" stroke="#1e293b"/>
  <text x="70" y="420" fill="#64748b" font-family="monospace" font-size="12">// Raw LoRaWAN PHYPayload Stream (18 Bytes):</text>
  <text x="70" y="445" fill="#c084fc" font-family="monospace" font-size="13">40 04 03 02 01 00 01 00 01 e6 48 fe 55 93 da 4e</text>
  <text x="70" y="470" fill="#c084fc" font-family="monospace" font-size="13">86 21</text>
  <text x="70" y="505" fill="#10b981" font-family="monospace" font-size="12">✓ Base64: QAQDAgEAAQAB5kj+VZPaToYh | MIC: 93 DA 4E 86 Valid | Airtime: 61.7 ms</text>

  <!-- Action Buttons -->
  <rect x="55" y="570" width="235" height="42" rx="6" fill="url(#accentGrad)"/>
  <text x="95" y="596" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">SYNTHESIZE UPLINK</text>

  <rect x="310" y="570" width="245" height="42" rx="6" fill="#334155"/>
  <text x="345" y="596" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">EXPORT TO PCAP (1700)</text>

  <!-- Right Column: Dissection & Audit Summary -->
  <rect x="610" y="150" width="560" height="510" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="635" y="185" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Real-Time Wire Dissection &amp; Compliance Card</text>

  <!-- Decoded Layers Tree -->
  <rect x="635" y="210" width="510" height="85" rx="6" fill="#020409" stroke="#1e293b"/>
  <text x="650" y="235" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="700">MAC Header (MHDR)</text>
  <text x="650" y="255" fill="#94a3b8" font-family="sans-serif" font-size="12">MType: Unconfirmed Data Up (0x40) | Major: LoRaWAN R1 (0x00)</text>
  <text x="650" y="275" fill="#94a3b8" font-family="sans-serif" font-size="12">Direction: Uplink (0) | Total Frame Length: 18 Bytes</text>

  <rect x="635" y="310" width="510" height="115" rx="6" fill="#020409" stroke="#1e293b"/>
  <text x="650" y="335" fill="#06b6d4" font-family="sans-serif" font-size="13" font-weight="700">Frame Header (FHDR) &amp; Security</text>
  <text x="650" y="355" fill="#94a3b8" font-family="sans-serif" font-size="12">DevAddr: 01 02 03 04 | FCnt: 1 | ADR: False | ACK: False | FOptsLen: 0</text>
  <text x="650" y="375" fill="#94a3b8" font-family="sans-serif" font-size="12">FPort: 1 | FRMPayload (AES-128 CTR Cipher): e6 48 fe 55 (4 Bytes)</text>
  <text x="650" y="398" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">MIC: 93 DA 4E 86 (AES-128 CMAC Signature Valid)</text>

  <!-- Security Audit Card -->
  <rect x="635" y="440" width="510" height="200" rx="6" fill="#04060d" stroke="#334155"/>
  <text x="650" y="465" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">LoRa Alliance Zero-Trust Security Posture</text>
  <rect x="1040" y="450" width="90" height="24" rx="4" fill="#10b981"/>
  <text x="1055" y="467" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">SCORE: 80%</text>

  <text x="650" y="495" fill="#10b981" font-family="sans-serif" font-size="12">✓ LORA-SEC-01: Unique Hardware Root AppKey Provisioned (Pass)</text>
  <text x="650" y="520" fill="#10b981" font-family="sans-serif" font-size="12">✓ LORA-SEC-02: Monotonic DevNonce Tracking Enforced on LNS (Pass)</text>
  <text x="650" y="545" fill="#ef4444" font-family="sans-serif" font-size="12">✗ LORA-SEC-05: Legacy Semtech UDP 1700 in Use (Migrate to Basic Station TLS)</text>
  <text x="650" y="570" fill="#ef4444" font-family="sans-serif" font-size="12">✗ LORA-SEC-04: FCnt Check Reset Bypass Allowed on Server Profile</text>
  <text x="650" y="605" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="600">Gateway Defense: 2 nftables conduit rules &amp; 4 Suricata signatures available</text>
</svg>